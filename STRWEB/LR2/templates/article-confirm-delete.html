{% extends 'base.html' %}
{% block title %}PetShop: {{ object.title }}{% endblock title %}
{% block header %}Are you sure you want to delete "{{ object.title }}"?{% endblock header %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'article-list' %}" class="btn btn-info">Cancel</a>
</form>
{% endblock %}
