{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Task 8: Class & Extends</title>
    </head>
    <body>
        <h1>Task 8 using Class & Extends</h1>

        <form id="pupilForm">
            <label>First Name:</label>
            <input type="text" id="firstNameField" minlength="1"/>
            <label>Last Name:</label>
            <input type="text" id="lastNameField" minlength="1"/>
            <label>Grade:</label>
            <input type="number" id="gradeField" min="1" max="11"/>
            <label>Class Letter:</label>
            <input type="text" id="letterField" minlength="1" maxlength="1"/>
            <button type="button" onclick="addPupil()">Add pupil</button>
        </form>

        <h2>Pupils:</h2>
        <ol id="pupilList"></ol>
        <h2>Same last names</h2>
        <ol id="matchesList"></ol>
        <button type="button" onclick="searchSameLastNames()">Find pupils with the same last name</button>

        <script src="{% static 'js/task_8a.js' %}"></script>
    </body>
</html>
