{% extends 'base.html' %}

{% block content %}
<h2>{{ faq.question }}</h2>

<p><strong>Publish Date (Local time):</strong> {{ faq.get_local_time }}</p>
<p><strong>Publish Date (UTC):</strong> {{ faq.get_utc_time }}</p>

<p>{{ faq.answer }}</p>

<a href="{% url 'faq-list' %}" class="btn btn-secondary">Return to faq list</a>
{% endblock %}
