{% extends 'base.html' %}

{% block content %}
<h2>Contact: {{ contact.description }}</h2>

<p>Phone number: {{ contact.phone }}</p>
<p>Email: {{ contact.email }}</p>
{% if contact.photo %}
    <img src="{{ contact.photo.url }}" alt="Photo">
{% endif %}

<a href="{% url 'contact-list' %}" class="btn btn-secondary">Return to contact list</a>
{% endblock %}
