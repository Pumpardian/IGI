{% extends 'base.html' %}

{% block content %}
<h2>{% if object %}Edit{% else %}Addition{% endif %} of article</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
</form>

<a href="{% url 'article-list' %}" class="btn btn-info">Cancel</a>
{% endblock %}
