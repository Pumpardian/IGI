{% extends 'base.html' %}
{% block title %}Pet Shop: Vacancies{% endblock title %}
{% block header %}Vacancies{% endblock header %}
{% block content %}
<table class="table">
    <thead>
        <tr>
            <th>Title</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for vacancy in object_list %}
        <tr>
            <td>{{ vacancy.title }}</td>
            <td>
                <a href="{% url 'vacancy-details' vacancy.id %}" class="btn btn-primary">Details</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
