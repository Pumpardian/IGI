{% extends 'base.html' %}
{% block title %}Pet Shop: FAQ{% endblock title %}
{% block header %}FAQ{% endblock header %}
{% block content %}
<dl>
    {% for faq in object_list %}
    <dt class="mt-4">
        <span style="font-size: 30px;">Q. {{ faq.question }}</span>
         <small title="{{ faq.get_utc_time }} UTC">{{ faq.get_local_time }}</small>
    </dt>
    <dd>
        <span style="font-size: 25px;"><b>A.</b> {{ faq.answer }}</span>
    </dd>
    {% endfor %}
</dl>
{% endblock %}
