{% extends 'base.html' %}
{% block title %}Pet Shop: {{ product.title }}{% endblock title %}
{% block header %}{% if object %}Edit{% else %}Addition{% endif %} of product{% endblock header %}
{% block content %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
</form>

<a href="{% url 'product-list' %}" class="btn btn-info">Cancel</a>
{% endblock %}
