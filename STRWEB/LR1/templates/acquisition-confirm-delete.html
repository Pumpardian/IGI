{% extends 'base.html' %}
{% block title %}Pet Shop: {{acquisition.title}}{% endblock title %}
{% block header %}Are you sure you want to delete "{{ acquisition.title }}"?{% endblock header %}
{% block content %}

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'acquisition-list' %}" class="btn btn-info">Cancel</a>
</form>
{% endblock %}
