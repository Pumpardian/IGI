{% extends 'base.html' %}

{% block content %}
<h2>{{ article.title }}</h2>

<p><strong>Publish Date (Local time):</strong> {{ article.get_local_time }}</p>
<p><strong>Publish Date (UTC):</strong> {{ article.get_utc_time }}</p>

<p>{{ article.content }}</p>
{% if article.image %}
    <img src="{{ article.image.url }}" alt="{{ article.title }}">
{% endif %}

<a href="{% url 'article-list' %}" class="btn btn-secondary">Return to article list</a>
{% endblock %}
