{% extends 'base.html' %}

{% block content %}
<h2>FAQ List</h2>

<table class="table">
    <thead>
        <tr>
            <th>Question</th>
            <th>Publish Date (Local time)</th>
            <th>Publish Date (UTC)</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for faq in object_list %}
        <tr>
            <td>{{faq.question}}</td>
            <td>{{faq.get_local_time}}</td>
            <td>{{faq.get_utc_time}}</td>
            <td>
                <a class="btn btn-primary" href="{% url 'faq-details' pk=faq.id %}">Details</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
